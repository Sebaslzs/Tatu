<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/tatu-icono-pequeno.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F5F0E6" />
    <title>Tatú</title>
    <script>
      // Modo oscuro antes de pintar, para no parpadear: lo que eligió la persona o, si no eligió, el sistema.
      ;(function () {
        var t = null
        try { t = localStorage.getItem('tatu.tema') } catch (e) {}
        var oscuro = t === 'claro' || t === 'oscuro' ? t === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro'
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0B1324')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
